<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FretFlow">
  <title>FretFlow</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="keyglow"></div>
  <div id="wash"></div>
  <div class="app">
    <header class="top">
      <div class="brand"><img src="icons/icon.svg" alt="" class="logo">FretFlow</div>
      <button id="keyBtn" class="key-btn"></button>
      <button id="sevBtn" class="btn ghost small" title="Use 7th chords on the wheel">7ths</button>
    </header>
    <main></main>
    <aside id="inspector"></aside>
    <footer id="tray"></footer>
    <nav class="tabs"></nav>
  </div>
  <div id="sheet" class="sheet hidden"><div class="sheet-body"></div></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
